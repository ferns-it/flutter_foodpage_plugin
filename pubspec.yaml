name: flutter_foodpage_plugin
description: A Flutter package was created by Foodpage to manage Foodpage's APIs and features.
version: 1.0.0
homepage: https://github.com/hashcode404/flutter_foodpage_plugin

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  #network
  dio: ^5.11.1
  socket_io_client: ^3.0.0

  #storage
  shared_preferences: ^2.5.5

  # Utils
  flutter_gen: ^5.15.0
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.3
  html: ^0.15.7
  flutter_treeview:
    path: packages/flutter_treeview
  fluttertoast: ^10.0.2
  fpdart: ^1.1.0

  # Icons
  fluentui_system_icons: ^1.1.239
  google_fonts: ^9.0.0
  font_awesome_flutter: ^11.0.0

  # State Management
  provider: ^6.1.2

  # Animation
  lottie: ^3.6.1

  # AI
  flutter_gemini: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true
    flare_flutter: false
    rive: false
    lottie: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # To add assets to your package, add an assets section, like this:
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/animations/
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/custom-fonts/#from-packages
